<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutinas">
<meta name="theme-color" content="#f8fafc">
<title>Leo & Sandra - Rutina Semanal</title>
<style>
:root{
  --bg:#f8fafc;
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --soft:#f1f5f9;
  --card:#fff;
  --green:#059669;
  --danger:#dc2626;
  --blue:#2563eb;
  --rose:#db2777;
  --shadow:0 18px 40px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{--accent:var(--blue);--accent-soft:#eff6ff;--accent-dark:#1d4ed8;min-height:100dvh}
.app.sandra{--accent:var(--rose);--accent-soft:#fdf2f8;--accent-dark:#9d174d}
.profile{min-height:100dvh;display:grid;place-items:center;padding:2rem;background:radial-gradient(circle at 18% 12%,#dbeafe 0,transparent 27%),radial-gradient(circle at 84% 18%,#fce7f3 0,transparent 25%),#fff}
.profile-panel{width:min(460px,100%)}
.brand{display:flex;gap:.9rem;align-items:center;margin-bottom:2rem}
.brand-mark{width:54px;height:54px;border-radius:16px;background:#0f172a;color:#fff;display:grid;place-items:center}
.brand-mark svg{width:28px;height:28px}
.brand h1{font-size:1.55rem;margin:0;letter-spacing:0}
.brand p{margin:.25rem 0 0;color:var(--muted);font-size:.9rem}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.profile-card{min-height:156px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:1rem;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--shadow)}
.profile-card:active{transform:scale(.98)}
.avatar{width:62px;height:62px;border-radius:18px;display:grid;place-items:center}
.avatar svg{width:34px;height:34px}
.profile-card strong{font-size:1.2rem}
.profile-card span{display:block;margin-top:.25rem;color:var(--muted);font-size:.82rem}
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(226,232,240,.82)}
.topbar-inner{width:min(900px,100%);margin:0 auto;padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.title h1{margin:0;font-size:1.1rem;line-height:1.2}
.title p{margin:.2rem 0 0;color:var(--muted);font-size:.78rem}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}
.icon-btn svg{width:19px;height:19px}
.progress{height:4px;background:#e5e7eb}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .2s ease}
.shell{width:min(900px,100%);margin:0 auto;padding:0 1rem 5rem}
.tabs{display:flex;gap:.55rem;overflow-x:auto;scrollbar-width:none;padding:1rem 0 .6rem}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;min-height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:.82rem;padding:.52rem .88rem}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.complete::after{content:"";display:inline-block;width:.45rem;height:.45rem;margin-left:.45rem;border-radius:999px;background:var(--green);vertical-align:middle}
.view-switch{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.15rem 0 1rem}
.view-btn{height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:900;display:flex;align-items:center;justify-content:center;gap:.42rem}
.view-btn svg{width:17px;height:17px}
.view-btn.on{background:#0f172a;border-color:#0f172a;color:#fff}
.day-hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1rem;margin-bottom:.85rem;display:grid;gap:.85rem}
.day-title{display:flex;gap:.85rem;align-items:flex-start;justify-content:space-between}
.day-title h2{margin:0;font-size:1.05rem;line-height:1.28;letter-spacing:0}
.day-title p{margin:.28rem 0 0;color:var(--muted);font-size:.82rem;line-height:1.45}
.count{font-weight:950;color:var(--accent);white-space:nowrap}
.day-actions{display:flex;gap:.55rem;flex-wrap:wrap;justify-self:start}
.reset-btn{min-height:40px;border-radius:12px;background:#fee2e2;color:var(--danger);font-size:.82rem;font-weight:900;padding:0 .8rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;justify-self:start}
.next-btn{min-height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-dark);font-size:.82rem;font-weight:900;padding:0 .8rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.reset-btn svg,.next-btn svg{width:16px;height:16px}
.timer-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1rem;margin-bottom:.85rem;display:grid;gap:.85rem}
.timer-top{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center}
.timer-kicker{display:block;color:var(--muted);font-size:.7rem;font-weight:950;text-transform:uppercase;letter-spacing:0;margin-bottom:.2rem}
.timer-panel strong{font-size:1rem}
.timer-panel p{margin:.25rem 0 0;color:var(--muted);font-size:.8rem;line-height:1.42}
.timer-display{font-variant-numeric:tabular-nums;font-size:1.75rem;font-weight:950;color:var(--accent);white-space:nowrap}
.timer-track{height:7px;border-radius:999px;background:var(--soft);overflow:hidden}
.timer-track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .2s linear}
.timer-controls{display:flex;gap:.45rem;flex-wrap:wrap}
.timer-btn{min-height:39px;border-radius:12px;background:var(--soft);color:#0f172a;font-size:.78rem;font-weight:900;padding:0 .72rem;display:inline-flex;align-items:center;justify-content:center;gap:.38rem}
.timer-btn.primary{background:#0f172a;color:#fff}
.timer-btn svg{width:15px;height:15px}
.cards{display:grid;gap:.8rem}
.exercise{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.exercise.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.exercise.pulse{animation:pulseCard .7s ease}
.exercise-main{display:grid;grid-template-columns:1fr 42px;gap:.75rem;padding:.9rem;align-items:start}
.ex-copy{min-width:0}
.ex-copy h3{margin:0;font-size:1rem;line-height:1.25;letter-spacing:0;overflow-wrap:anywhere}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.chip{border-radius:999px;background:var(--soft);color:#334155;font-size:.72rem;font-weight:850;padding:.34rem .55rem}
.chip.accent{background:var(--accent-soft);color:var(--accent-dark)}
.set-checks{border-top:1px solid var(--line);display:grid;gap:.5rem;padding:.8rem .9rem .2rem}
.set-checks-title{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:900}
.set-check-row{display:flex;gap:.45rem;flex-wrap:wrap}
.set-check{min-width:42px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:.82rem;font-weight:950;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.set-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.set-check.next{border-color:var(--accent);color:var(--accent-dark);box-shadow:0 0 0 3px var(--accent-soft)}
.set-check svg{width:14px;height:14px}
.check{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--muted);display:grid;place-items:center}
.check svg{width:19px;height:19px}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.exercise-actions{display:flex;gap:.5rem;padding:0 .9rem .9rem}
.text-btn{min-height:38px;border-radius:12px;background:var(--soft);color:#0f172a;font-size:.8rem;font-weight:900;padding:0 .78rem;display:inline-flex;align-items:center;justify-content:center;gap:.42rem}
.text-btn svg{width:16px;height:16px}
.guide-tools{display:grid;grid-template-columns:1fr;gap:.7rem;margin-bottom:.85rem}
.search{height:44px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:0 .85rem;outline:0}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.guide-list{display:grid;gap:.7rem}
.guide-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.85rem;display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:center}
.guide-card h3{margin:0;font-size:.95rem;line-height:1.25}
.guide-card p{margin:.25rem 0 0;color:var(--muted);font-size:.78rem}
.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.2rem;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.46);display:grid;align-items:end}
.sheet{background:#fff;border-radius:22px 22px 0 0;max-height:88dvh;overflow:auto;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.sheet-head h2{margin:0;font-size:1.12rem;line-height:1.25}
.sheet-head p{margin:.28rem 0 0;color:var(--muted);font-size:.8rem}
.guide-section{border-top:1px solid var(--line);padding-top:.85rem;margin-top:.85rem}
.guide-section h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 .55rem}
.guide-section p,.guide-section li{font-size:.9rem;line-height:1.5;color:#334155}
.guide-section p{margin:0}
.guide-section ol,.guide-section ul{margin:.2rem 0 0;padding-left:1.25rem}
.toast{position:fixed;left:50%;bottom:1.2rem;z-index:60;transform:translateX(-50%) translateY(12px);opacity:0;background:#0f172a;color:#fff;border-radius:999px;padding:.72rem 1rem;font-size:.82rem;font-weight:900;box-shadow:var(--shadow);transition:.2s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes pulseCard{
  0%{box-shadow:0 0 0 0 var(--accent-soft)}
  45%{box-shadow:0 0 0 8px var(--accent-soft)}
  100%{box-shadow:0 0 0 3px var(--accent-soft)}
}
@media (min-width:760px){
  .shell{padding-bottom:2rem}
  .day-hero{grid-template-columns:1fr auto;align-items:center}
  .day-actions{justify-self:end}
  .reset-btn{justify-self:end}
  .cards{grid-template-columns:1fr 1fr}
  .guide-list{grid-template-columns:1fr 1fr}
  .modal{align-items:center;padding:2rem}
  .sheet{width:min(760px,100%);margin:auto;border-radius:22px;max-height:84dvh}
}
@media (max-width:420px){
  .profile-grid{gap:.65rem}
  .profile-card{min-height:142px}
  .timer-top{grid-template-columns:1fr}
  .timer-display{font-size:1.55rem}
  .exercise-main{grid-template-columns:1fr 40px;padding:.8rem}
  .chips{gap:.32rem}
}
</style>
</head>

function render(){
  ensureState();
  const root=document.getElementById("root");
  if(!state.user){root.innerHTML=renderProfile();bindProfile();return}
  const c=completion();
  root.innerHTML=`<div class="app ${state.user==="Sandra"?"sandra":""}">
    ${renderTop(c)}
    <main class="shell">
      ${renderVersionTabs()}
      ${renderDayTabs()}
      ${renderViewSwitch()}
      ${state.view==="guide"?renderGuide():renderRoutine()}
    </main>
    ${state.guide?renderModal(state.guide):""}
  </div>`;
  bindApp();
  startTimerTicker();
}
function renderProfile(){
  return `<div class="profile"><section class="profile-panel">
    <div class="brand"><div class="brand-mark">${icon("dumbbell")}</div><div><h1>Leo & Sandra</h1><p>Weekly gym routine</p></div></div>
    <div class="profile-grid">${Object.keys(ROUTINES).map(user=>`<button class="profile-card" data-profile="${user}">
      <div class="avatar" style="background:${PEOPLE[user].soft};color:${PEOPLE[user].accent}">${icon("user")}</div>
      <div><strong>${user}</strong><span>${TXT[ROUTINES[user].lang].choose}</span></div>
    </button>`).join("")}</div>
  </section></div>`;
}
function renderTop(c){
  const tx=t();
  return `<header class="topbar"><div class="topbar-inner">
    <div class="title"><h1>${tx.routine} ${state.user}</h1><p>${state.version} · ${currentDay().label} · ${c.done}/${c.total} ${tx.done} · ${tx.week} ${weekLabel()}</p></div>
    <button class="icon-btn" data-action="switch" title="${tx.choose}">${icon("swap")}</button>
  </div><div class="progress"><span style="width:${c.pct}%"></span></div></header>`;

function renderVersionTabs(){

}
function renderDayTabs(){

function renderExercise(ex,day,index){
  const tx=t();
  const checked=isExerciseDone(day,index);
  const count=setCount(ex);
  const firstOpen=nextOpenIndex(day);
  const firstSet=nextSetIndex(day.id,index,count);
  return `<article class="exercise ${index===firstOpen?"current":""}" data-exercise="${index}">
    <div class="exercise-main">
      <div class="ex-copy"><h3>${escapeHtml(ex.n)}</h3><div class="chips">
        ${ex.sets?`<span class="chip">${tx.sets}: ${escapeHtml(ex.sets)}</span>`:""}
        ${ex.reps?`<span class="chip">${tx.reps}: ${escapeHtml(ex.reps)}</span>`:""}
        ${ex.effort?`<span class="chip accent">${tx.load}: ${escapeHtml(ex.effort)}</span>`:""}
      </div></div>
      <button class="check ${checked?"on":""}" data-check="${day.id}:${index}" title="${tx.done}">${icon("check")}</button>
    </div>
    ${count?`<div class="set-checks">
      <div class="set-checks-title">${tx.setChecks}</div>
      <div class="set-check-row">${Array.from({length:count},(_,setIndex)=>{
        const done=isSetDone(day.id,index,setIndex)||!!state.checks[key(day.id,index)];
        const next=!checked&&!done&&setIndex===firstSet;
        return `<button class="set-check ${done?"on":""} ${next?"next":""}" data-set-check="${day.id}:${index}:${setIndex}">${done?icon("check"):""}<span>${setIndex+1}</span></button>`;
      }).join("")}</div>
    </div>`:""}
    <div class="exercise-actions"><button class="text-btn" data-guide-name="${escapeAttr(ex.n)}">${icon("info")}<span>${tx.how}</span></button></div>
  </article>`;
}
function renderGuide(){
  const tx=t();
  const query=normalize(state.query);
  const items=allGuideItems().filter(ex=>!query||normalize(ex.n).includes(query)||normalize(categoryFor(ex.n)).includes(query));
  return `<section>
    <div class="guide-tools"><input class="search" value="${escapeAttr(state.query)}" data-search placeholder="${tx.search}"></div>
    <div class="guide-list">${items.length?items.map(ex=>renderGuideCard(ex)).join(""):`<div class="empty">${tx.noGuide}</div>`}</div>
  </section>`;
}
function renderGuideCard(ex){
  const tx=t();
  const cat=categoryFor(ex.n);
  return `<article class="guide-card">
    <div><h3>${escapeHtml(ex.n)}</h3><p>${ex.day} · ${cat.replace("_"," ")}</p></div>
    <button class="text-btn" data-guide-name="${escapeAttr(ex.n)}">${tx.how}</button>
  </article>`;
}
function renderModal(name){
  const tx=t();
  const ex=allGuideItems().find(item=>item.n===name)||{n:name,sets:"",reps:"",effort:""};
  const cat=categoryFor(ex.n);
  const [overview,steps,cues]=guideText(cat);
  return `<div class="modal" data-action="closeGuide">
    <section class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <div class="sheet-head"><div><h2>${escapeHtml(ex.n)}</h2><p>${[ex.sets&&`${tx.sets}: ${ex.sets}`,ex.reps&&`${tx.reps}: ${ex.reps}`,ex.effort&&`${tx.load}: ${ex.effort}`].filter(Boolean).join(" · ")}</p></div><button class="icon-btn" data-action="closeGuide" title="${tx.close}">${icon("close")}</button></div>
      <div class="guide-section"><h3>${tx.overview}</h3><p>${escapeHtml(overview)}</p></div>
      <div class="guide-section"><h3>${tx.steps}</h3><ol>${steps.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ol></div>
      <div class="guide-section"><h3>${tx.cues}</h3><ul>${cues.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ul></div>
    </section>
  </div>`;
}
function bindProfile(){
  document.querySelectorAll("[data-profile]").forEach(btn=>btn.addEventListener("click",()=>{
    state.user=btn.dataset.profile;
    if(!versions().includes(state.version))state.version="4D";
    state.dayId=null;
    state.view="routine";
    ensureState();
    saveState();
    render();
  }));
}
function bindApp(){
  document.querySelectorAll("[data-version]").forEach(btn=>btn.addEventListener("click",()=>{
    state.version=btn.dataset.version;
    state.dayId=null;
    state.guide=null;
    ensureState();
    saveState();
    render();
  }));
  document.querySelectorAll("[data-day]").forEach(btn=>btn.addEventListener("click",()=>{state.dayId=btn.dataset.day;saveState();render()}));
  document.querySelectorAll("[data-view]").forEach(btn=>btn.addEventListener("click",()=>{state.view=btn.dataset.view;saveState();render()}));
  document.querySelectorAll("[data-check]").forEach(btn=>btn.addEventListener("click",()=>{
    const [dayId,index]=btn.dataset.check.split(":");
    const day=days().find(item=>item.id===dayId);
    const exIndex=Number(index);
    const count=day?setCount(day.items[exIndex]):0;
    const next=day?!isExerciseDone(day,exIndex):!state.checks[key(dayId,exIndex)];
    delete state.checks[key(dayId,exIndex)];
    if(count>0){
      Array.from({length:count},(_,setIndex)=>setIndex).forEach(setIndex=>{
        const k=setKey(dayId,exIndex,setIndex);
        if(next)state.checks[k]=true;
        else delete state.checks[k];
      });
    }else{
      state.checks[key(dayId,exIndex)]=next;
    }
    saveState();
    render();
  }));
  document.querySelectorAll("[data-set-check]").forEach(btn=>btn.addEventListener("click",()=>{
    const [dayId,index,setIndex]=btn.dataset.setCheck.split(":");
    const exIndex=Number(index);
    const k=setKey(dayId,exIndex,Number(setIndex));
    delete state.checks[key(dayId,exIndex)];
    state.checks[k]=!state.checks[k];
    saveState();
    render();
  }));
  document.querySelectorAll("[data-guide-name]").forEach(btn=>btn.addEventListener("click",()=>{state.guide=btn.dataset.guideName;saveState();render()}));
  document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",handleAction));
  const search=document.querySelector("[data-search]");
  if(search)search.addEventListener("input",()=>{state.query=search.value;saveState();render()});
}
function focusNextOpen(){
  const index=nextOpenIndex(currentDay());
  if(index<0){toast(t().allDone);return}
  const el=document.querySelector(`[data-exercise="${index}"]`);
  if(!el)return;
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.remove("pulse");
  window.setTimeout(()=>el.classList.add("pulse"),20);
  window.setTimeout(()=>el.classList.remove("pulse"),800);
}
function startTimerTicker(){
  clearInterval(timerTicker);
  timerTicker=null;
  updateTimerDom();
  if(state.timer?.running)timerTicker=setInterval(updateTimerDom,250);
}
function updateTimerDom(){
  state.timer=normalizeTimer(state.timer);
  const tm=state.timer;
  if(tm.mode==="countdown"&&tm.running&&timerElapsed()>=tm.duration){
    state.timer={...tm,running:false,startAt:0,elapsed:tm.duration,done:true};
    saveState();
    toast(t().timeUp);
    render();
    return;
  }
  const timeEl=document.getElementById("timerTime");
  const fillEl=document.getElementById("timerFill");
  const modeEl=document.getElementById("timerMode");
  if(timeEl)timeEl.textContent=timerDisplay();
  if(fillEl)fillEl.style.width=`${timerProgress()}%`;
  if(modeEl)modeEl.textContent=tm.mode==="countdown"?t().countdown:t().stopwatch;
  if(timerTicker&&!state.timer.running){clearInterval(timerTicker);timerTicker=null}
}
function handleAction(event){
  const action=event.currentTarget.dataset.action;
  if(action==="switch"){state.user=null;state.guide=null;state.timer=defaultTimer();saveState();render()}
  if(action==="resetDay"){currentDay().items.forEach((ex,i)=>{
    delete state.checks[key(currentDay().id,i)];
    Array.from({length:setCount(ex)},(_,setIndex)=>setIndex).forEach(setIndex=>delete state.checks[setKey(currentDay().id,i,setIndex)]);
  });saveState();toast(t().resetMsg);render()}
  if(action==="nextOpen")focusNextOpen();
  if(action==="timerPreset")startCountdown(Number(event.currentTarget.dataset.seconds)||60);
  if(action==="timerStopwatch")startStopwatch();
  if(action==="timerPause")pauseTimer();
  if(action==="timerResume")resumeTimer();
  if(action==="timerReset")resetTimer();
  if(action==="closeGuide"){state.guide=null;saveState();render()}
}
function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),1600);
}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(value){return escapeHtml(value)}

render();
</script>
</body>
</html>
